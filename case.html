<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>案例匹配 - 乡智新生</title>

  <!-- fontawesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <!-- stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="case-page">

  <!-- 顶部导航栏：沿用全站 header -->
  <header>
    <nav>
      <a class="nav-items" href="index.html">首页</a>
      <a class="nav-items" href="project.html">项目定位</a>
      <a class="nav-items active" href="case.html">案例匹配</a>
      <a class="nav-items" href="cases.html">案例库</a>
      <a class="nav-items" href="cobuild.html">案例共建</a>
    </nav>
  </header>

  <!-- 视口两侧翻页箭头：与其他子页面一致 -->
  <div class="slider">
    <a href="project.html"><i class="fa-solid fa-chevron-left"></i></a>
    <a href="cases.html"><i class="fa-solid fa-chevron-right"></i></a>
  </div>

  <!-- 问卷主布局：左侧进度导航 1 份 / 右侧问卷卡片 4 份 -->
  <main class="quiz-wrap">

    <!-- ========== 左侧：进度导航区 ========== -->
    <aside class="quiz-side">
      <div class="step-btns">
        <button class="step-btn" data-step="0">拥有资源</button>
        <button class="step-btn" data-step="1">创业方向</button>
        <button class="step-btn" data-step="2">当前阶段</button>
        <button class="step-btn" data-step="3">匹配结果</button>
      </div>
      <!-- 垂直进度条：均匀分 4 段，每完成一题前进 1/4 -->
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
    </aside>

    <!-- ========== 右侧：堆叠问卷卡片区 ========== -->
    <section class="quiz-cards">

      <!-- 卡片1：拥有资源 -->
      <article class="quiz-card" data-card="0" data-multi>
        <button class="card-up" aria-label="上一题"><i class="fa-solid fa-chevron-up"></i></button>
        <h2 class="card-title">您目前拥有哪些资源？</h2>
        <div class="card-divider"></div>
        <div class="options">
          <div class="option-col">
            <button class="option" data-value="土地资源">土地资源</button>
            <button class="option" data-value="农产品">农产品</button>
            <button class="option" data-value="养殖资源">养殖资源</button>
            <button class="option" data-value="乡村空间">乡村空间</button>
          </div>
          <div class="option-col">
            <button class="option" data-value="AI能力">AI能力</button>
            <button class="option" data-value="内容能力">内容能力</button>
            <button class="option" data-value="销售渠道">销售渠道</button>
          </div>
        </div>
        <button class="card-down" aria-label="确认并进入下一题"><i class="fa-solid fa-chevron-down"></i></button>
      </article>

      <!-- 卡片2：创业方向 -->
      <article class="quiz-card" data-card="1" data-multi>
        <button class="card-up" aria-label="上一题"><i class="fa-solid fa-chevron-up"></i></button>
        <h2 class="card-title">您想往哪个方向发展？</h2>
        <div class="card-divider"></div>
        <div class="options">
          <div class="option-col">
            <button class="option" data-value="品牌打造">品牌打造</button>
            <button class="option" data-value="电商销售">电商销售</button>
            <button class="option" data-value="养殖创业">养殖创业</button>
          </div>
          <div class="option-col">
            <button class="option" data-value="农业服务">农业服务</button>
            <button class="option" data-value="数字农业">数字农业</button>
            <button class="option" data-value="乡村体验">乡村体验</button>
          </div>
        </div>
        <button class="card-down" aria-label="确认并进入下一题"><i class="fa-solid fa-chevron-down"></i></button>
      </article>

      <!-- 卡片3：当前阶段 -->
      <article class="quiz-card" data-card="2">
        <button class="card-up" aria-label="上一题"><i class="fa-solid fa-chevron-up"></i></button>
        <h2 class="card-title">您目前处于哪个阶段？</h2>
        <div class="card-divider"></div>
        <div class="options">
          <div class="option-col">
            <button class="option option-rich" data-value="想法阶段">
              <span class="opt-title">想法阶段</span>
              <span class="opt-desc">有创业想法，但还未落地实施</span>
            </button>
            <button class="option option-rich" data-value="已有产品">
              <span class="opt-title">已有产品</span>
              <span class="opt-desc">已有农产品或服务，寻求品牌化和规模化</span>
            </button>
          </div>
          <div class="option-col">
            <button class="option option-rich" data-value="已有客户">
              <span class="opt-title">已有客户</span>
              <span class="opt-desc">已有稳定客户群体，希望拓展渠道和规模</span>
            </button>
            <button class="option option-rich" data-value="产业基础">
              <span class="opt-title">产业基础</span>
              <span class="opt-desc">已有一定产业基础，寻求转型升级</span>
            </button>
          </div>
        </div>
        <button class="card-down" aria-label="确认并查看匹配结果"><i class="fa-solid fa-chevron-down"></i></button>
      </article>

      <!-- 卡片4：匹配结果 -->
      <article class="quiz-card" data-card="3">
        <button class="card-up" aria-label="上一题"><i class="fa-solid fa-chevron-up"></i></button>
        <h2 class="card-title">匹配结果</h2>
        <div class="card-divider"></div>

        <!-- 结果内容区：上方为 5 张赛道卡片，底部预留 1/3 留白 -->
        <div class="result-area">
          <div class="result-cards">
            <!-- 左侧大卡：最高匹配（初始演示数据，进入结果页时按问卷重算） -->
            <a class="track-card track-main" data-track="plant" href="plant.html">
              <span class="track-rate">92%</span>
              <span class="track-name">种植业</span>
            </a>
            <!-- 右侧 2×2 田字格：其余 4 条赛道 -->
            <div class="track-grid">
              <a class="track-card" data-track="animal" href="animal.html">
                <span class="track-rate">78%</span>
                <span class="track-name">畜牧业</span>
              </a>
              <a class="track-card" data-track="forest" href="forest.html">
                <span class="track-rate">65%</span>
                <span class="track-name">林业</span>
              </a>
              <a class="track-card" data-track="fish" href="fish.html">
                <span class="track-rate">56%</span>
                <span class="track-name">水产养殖业</span>
              </a>
              <a class="track-card" data-track="digital" href="digital.html">
                <span class="track-rate">44%</span>
                <span class="track-name">数字农业</span>
              </a>
            </div>
          </div>
        </div>
      </article>

    </section>
  </main>

  <!-- ========== 原生 JS：问卷交互逻辑 ========== -->
  <script>
    /* ---------- 状态 ---------- */
    const cards = document.querySelectorAll('.quiz-card');      // 4 张卡片
    const stepBtns = document.querySelectorAll('.step-btn');    // 左侧 4 个步骤按钮
    const progressFill = document.querySelector('.progress-fill');
    const total = cards.length;
    let current = 0;                                            // 当前步骤索引
    const selections = new Array(total).fill(null);             // 每步选中的选项值

    /* ---------- 渲染：卡片堆叠、按钮完成态、进度条 ----------
       高亮规则：步骤索引 <= current 的按钮为深绿（含当前步骤），回退/跳转自动取消后续完成态 */
    function render() {
      cards.forEach((card, i) => {
        if (i < current) {
          // 已走过的卡片：上移淡出，不可交互
          card.style.transform = 'translateY(-28px)';
          card.style.opacity = '0';
          card.style.zIndex = 10;
          card.style.pointerEvents = 'none';
        } else {
          // 当前卡片在最上层；后续卡片每层向下偏移 16px，露出边框形成堆叠
          card.style.transform = 'translateY(' + (i - current) * 16 + 'px)';
          card.style.opacity = '1';
          card.style.zIndex = 40 - (i - current);
          card.style.pointerEvents = 'auto';
        }
      });

      // 左侧按钮：当前及已完成 → 深绿，未完成 → 灰
      stepBtns.forEach((btn, i) => btn.classList.toggle('done', i <= current));

      // 进度条：第1题 1/4，到匹配结果走完 4/4；同时写 height（桌面竖条）和 width（移动端横条）
      const pct = ((current + 1) / total) * 100 + '%';
      progressFill.style.height = pct;
      progressFill.style.width = pct;

      // 进入结果页时按当前选择重算匹配度（返回改答案再进来也会刷新）
      if (current === total - 1) updateResults();
    }

    /* ---------- 选项选择：第1/2题多选（toggle），第3题单选（互斥） ---------- */
    document.querySelectorAll('.option').forEach(opt => {
      opt.addEventListener('click', () => {
        const card = opt.closest('.quiz-card');
        const idx = +card.dataset.card;
        const value = opt.dataset.value;
        if (card.dataset.multi !== undefined) {
          // 多选：可选中多个，再次点击取消
          if (!Array.isArray(selections[idx])) selections[idx] = [];
          const arr = selections[idx];
          const pos = arr.indexOf(value);
          if (opt.classList.toggle('selected')) {
            if (pos === -1) arr.push(value);
          } else if (pos !== -1) {
            arr.splice(pos, 1);
          }
        } else {
          // 单选：同一张卡内互斥
          card.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
          selections[idx] = value;
        }
      });
    });

    /* ---------- 下一题：多选需至少 1 项，单选需选中 1 项 ---------- */
    document.querySelectorAll('.card-down').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = +btn.closest('.quiz-card').dataset.card;
        const sel = selections[idx];
        if (Array.isArray(sel) ? sel.length === 0 : sel === null) return;   // 未选择不前进
        current = idx + 1;
        render();
      });
    });

    /* ---------- 上一题：完成状态取消、进度回退 ---------- */
    document.querySelectorAll('.card-up').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = +btn.closest('.quiz-card').dataset.card;
        current = Math.max(0, idx - 1);
        render();
      });
    });

    /* ---------- 左侧导航：点击直接跳转对应步骤 ---------- */
    stepBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        current = +btn.dataset.step;
        render();
      });
    });

    /* ---------- 匹配结果：按前三题选择动态计算 5 条赛道匹配度 ---------- */
    const TRACKS = [
      { key: 'plant',   name: '种植业',     page: 'plant.html' },
      { key: 'animal',  name: '畜牧业',     page: 'animal.html' },
      { key: 'forest',  name: '林业',       page: 'forest.html' },
      { key: 'fish',    name: '水产养殖业', page: 'fish.html' },
      { key: 'digital', name: '数字农业',   page: 'digital.html' },
    ];

    /* 选项 → 赛道权重映射（演示级，可随时调整数值） */
    const Q1_WEIGHTS = { // 拥有资源
      '土地资源': { plant: 2, forest: 2, animal: 1 },
      '农产品':   { plant: 2 },
      '养殖资源': { animal: 2, fish: 2 },
      '乡村空间': { forest: 1, plant: 1 },
      'AI能力':   { digital: 2 },
      '内容能力': { digital: 1 },
      '销售渠道': { digital: 1 },
    };
    const Q2_WEIGHTS = { // 创业方向
      '电商销售': { digital: 2 },
      '养殖创业': { animal: 2, fish: 2 },
      '农业服务': { digital: 1 },
      '数字农业': { digital: 3 },
      '乡村体验': { forest: 1, plant: 1 },
      '品牌打造': {},
    };
    const Q3_WEIGHTS = { // 当前阶段
      '已有产品': { plant: 1, animal: 1, fish: 1 },
      '已有客户': { digital: 1 },
      '产业基础': { plant: 1, animal: 1, forest: 1, fish: 1, digital: 1 },
      '想法阶段': {},
    };

    /* 未作答直接点第4步时的演示兜底值（与初始 HTML 一致） */
    const FALLBACK = { plant: 92, animal: 78, forest: 65, fish: 56, digital: 44 };

    /* 计分 → 归一化为百分比：得分占比 ×100，四舍五入误差加到最高分赛道（总和恒 100） */
    function updateResults() {
      const score = {};
      TRACKS.forEach(t => score[t.key] = 0);
      [Q1_WEIGHTS, Q2_WEIGHTS, Q3_WEIGHTS].forEach((weights, q) => {
        const sel = selections[q];
        if (!sel) return;
        (Array.isArray(sel) ? sel : [sel]).forEach(value => {
          const w = weights[value];
          if (w) Object.keys(w).forEach(k => score[k] += w[k]);
        });
      });

      const total = Object.values(score).reduce((a, b) => a + b, 0);
      const list = TRACKS.map(t => ({
        ...t,
        pct: total === 0 ? FALLBACK[t.key] : Math.round(score[t.key] / total * 100),
      }));
      if (total > 0) {
        // 修复四舍五入造成的 ±1% 误差
        const diff = 100 - list.reduce((a, t) => a + t.pct, 0);
        list.sort((a, b) => score[b.key] - score[a.key])[0].pct += diff;
      }
      list.sort((a, b) => b.pct - a.pct);

      // 第 1 名写入左侧大卡，第 2-5 名依次写入右侧田字格
      const mainCard = document.querySelector('.track-main');
      const gridCards = document.querySelectorAll('.track-grid .track-card');
      list.forEach((t, i) => {
        const el = i === 0 ? mainCard : gridCards[i - 1];
        el.dataset.track = t.key;
        el.href = t.page;
        el.querySelector('.track-rate').textContent = t.pct + '%';
        el.querySelector('.track-name').textContent = t.name;
      });
    }

    render();
  </script>

</body>
</html>
