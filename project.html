</head>
<body class="card-page">

  <header>
    <nav>
      <a class="nav-items" href="index.html">首页</a>
      <a class="nav-items active" href="project.html">项目定位</a>
      <a class="nav-items" href="case.html">案例匹配</a>
      <a class="nav-items" href="cases.html">案例库</a>
      <a class="nav-items" href="cobuild.html">案例共建</a>

  <div class="slider">
    <a href="index.html"><i class="fa-solid fa-chevron-left"></i></a>
    <a href="matching.html"><i class="fa-solid fa-chevron-right"></i></a>
  </div>

  <main class="glass-card">

      <h1 class="page-title">让乡村创业有方法可循</h1>

      <p class="page-desc">
        乡智新生是由华南农业大学创新创业学院孵化的乡村OPC创业孵化与经验共享平台。我们深入调研真实乡村创业案例，总结不同农业赛道的成功模式，帮助创业者降低试错成本，找到属于自己的乡村创业之路。
      </p>

      <div class="case-section">
        <div class="case-text">
          <h2>真实案例调研</h2>
          <span class="case-sub">EMPIRICAL CASE STUDY</span>
        </div>

        <div class="carousel">
          <div class="carousel-shell">
            <div class="carousel-stack">
              <img src="img/图片集1.jpg" alt="图片集1">
              <img src="img/图片集2.jpg" alt="图片集2">
              <img src="img/图片集3.jpg" alt="图片集3">
              <img src="img/图片集4.jpg" alt="图片集4">
              <img src="img/图片集5.jpg" alt="图片集5">
            </div>
          </div>

          <div class="carousel-controls">
            <button class="carousel-btn prev" aria-label="上一张"><i class="fa-solid fa-chevron-left"></i></button>
            <button class="carousel-btn next" aria-label="下一张"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </div>
      </div>

  </main>

  <script>
    const stack = document.querySelector('.carousel-stack');
    const slides = stack.children;
    const prevBtn = document.querySelector('.carousel-btn.prev');
    const nextBtn = document.querySelector('.carousel-btn.next');
    let index = 0;

    function update() {
      const n = slides.length;
      for (let i = 0; i < n; i++) {
        const offset = ((i - index) % n + n) % n;
        slides[i].className =
          offset === 0 ? 'slide-main'
          : offset === 1 ? 'slide-right1'
          : offset === 2 ? 'slide-right2'
          : offset === 3 ? 'slide-left2'
          : 'slide-left1';
      }
    }

    prevBtn.addEventListener('click', () => { index = (index - 1 + slides.length) % slides.length; update(); });
    nextBtn.addEventListener('click', () => { index = (index + 1) % slides.length; update(); });

    update();
  </script>

</body>
</html>
